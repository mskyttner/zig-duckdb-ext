<!doctype html>
<html>
<head><meta charset="utf-8"><title>wasm-ext browser verify</title></head>
<body>
<!--
  Served by verify_wasm_load_browser.cjs's own static server, alongside a duckdb-wasm
  engine's own `dist/duckdb-mvp.wasm`/`duckdb-browser-mvp.worker.js`/`duckdb-browser.mjs`
  and the built extension. Loaded by Playwright, not meant to be opened by hand (though
  it works that way too, served over plain http://, with ?name=<extension-name> in the URL).

  The import map is required: `duckdb-browser.mjs` has a bare `import ... from
  "apache-arrow"`, meant to be resolved by a real bundler (webpack/vite) — the same
  thing duckdb-wasm's own docs show for those consumers. A bare browser <script
  type="module"> has no bundler, so this maps that one bare specifier at a CDN ESM
  build instead (confirmed directly: this is what it takes, not a guess).
-->
<div id="result">PENDING</div>
<script type="importmap">
{ "imports": { "apache-arrow": "https://esm.sh/apache-arrow@17.0.0" } }
</script>
<script type="module">
import * as duckdb from './duckdb-browser.mjs';

const params = new URLSearchParams(location.search);
const extName = params.get('name');
const coi = params.get('coi') === '1';
// Official duckdb-wasm's naming as of its 2026-10-21 DuckDB-2.0.0 bump (duckdb/duckdb-wasm#2285)
// — `base`/`duckdb-base.wasm` instead of `mvp`/`duckdb-mvp.wasm`. Set by the caller
// (verify_wasm_load_browser.cjs), which already knows which files actually exist in the
// engine directory it's serving; this page can't detect that itself.
const base = params.get('base') === '1';
// Signed-repository mode (docs/rationale/0004's "self-signed v2 distribution" mechanism,
// confirmed working inside a real duckdb-wasm browser engine 2026-11-04): `pubkey` is the
// signing key's PEM, passed inline because wasm's httpfs can't do the `.well-known`
// auto-discovery fetch the native CLI uses (confirmed live — see this project's own
// 2026-11-04 probe). When absent, falls back to the original unsigned
// `custom_extension_repository` + bare `LOAD` flow.
const pubkeyPem = params.get('pubkey');

async function main() {
    const worker = new Worker(coi ? './duckdb-browser-coi.worker.js' : base ? './duckdb-browser-base.worker.js' : './duckdb-browser-mvp.worker.js');
    const logger = new duckdb.ConsoleLogger();
    const db = new duckdb.AsyncDuckDB(logger, worker);
    await db.instantiate(coi ? './duckdb-coi.wasm' : base ? './duckdb-base.wasm' : './duckdb-mvp.wasm', coi ? './duckdb-browser-coi.pthread.worker.js' : null);
    const conn = await (async () => {
        if (pubkeyPem) {
            // No `allowUnsignedExtensions` needed on this path — the extension is actually
            // signed, and the repository's own pinned key is what DuckDB checks instead.
            await db.open({ homeDirectory: '/home/web_user' });
            const c = await db.connect();
            await c.query("SET allow_extension_repositories = 'allowed'");
            await c.query(`CREATE EXTENSION REPOSITORY wasm_verify_repo WITH PREFIX '${location.origin}' USING PUBLIC KEY '${pubkeyPem}'`);
            await c.query(`LOAD ${extName} FROM wasm_verify_repo`);
            return c;
        }
        await db.open({ allowUnsignedExtensions: true });
        const c = await db.connect();
        await c.query(`SET custom_extension_repository = '${location.origin}'`);
        await c.query(`LOAD ${extName}`);
        return c;
    })();

    const results = {};
    const run = async (label, sql, pick) => {
        const rows = (await conn.query(sql)).toArray().map(r => r.toJSON());
        results[label] = pick ? pick(rows) : rows[0];
    };

    await run('zig_hello', `SELECT zig_hello('ci') AS greeting`);
    await run('zig_add_numbers', `SELECT zig_add_numbers(2, 3) AS sum`, rows => Number(rows[0].sum));
    await run('zig_tokenize', `SELECT token FROM zig_tokenize('a,b,c', ',') ORDER BY token_pos`, rows => rows.map(r => r.token));
    await run('ct_add_numbers', `SELECT ct_add_numbers(2, 3) AS sum`, rows => Number(rows[0].sum));
    await run('ct_tokenize', `SELECT token FROM ct_tokenize('alice,bob,charlie', ',') ORDER BY token_pos`, rows => rows.map(r => r.token));
    await run('tp_bar', `SELECT tp_bar(0.5, "on" := 'X', "off" := '.', width := 10) AS bar`, rows => rows[0].bar);

    await conn.close();
    if (coi) results.crossOriginIsolated = self.crossOriginIsolated;
    return results;
}

main().then(r => {
    document.getElementById('result').textContent = JSON.stringify(r);
}).catch(e => {
    document.getElementById('result').textContent = 'ERROR: ' + (e && e.stack ? e.stack : e);
});
</script>
</body>
</html>
