version: "3"

# ---------------------------------------------------------------------------
# Zig DuckDB Extension — task automation
# Preconfigured by `reins init --lang zig`, then tailored for DuckDB
# extension development.
#
# The `check:all` task is mandatory. AGENTS.md rule V-01 requires the agent
# to run it before every commit.
# ---------------------------------------------------------------------------

tasks:
  check:all:
    desc: "Run all quality gates"
    deps: [format, build, test:unit]
    cmds:
      - echo "All checks passed!"

  format:
    desc: "Format Zig source files"
    cmds:
      - zig fmt src/

  build:
    desc: "Compile the extension (debug)"
    cmds:
      - zig build

  build:release:
    desc: "Compile the extension (release-safe)"
    cmds:
      - zig build -Doptimize=ReleaseSafe

  test:unit:
    desc: "Run unit tests"
    cmds:
      - zig build test

  test:e2e:
    desc: "End-to-end tests: build, load into DuckDB, run all SQL test files"
    deps: [build]
    cmds:
      - |
        EXT_PATH=$(find zig-out/lib -name '*.duckdb_extension' 2>/dev/null | head -1)
        if [ -z "$EXT_PATH" ]; then
          echo "ERROR: No .duckdb_extension found in zig-out/lib/"
          exit 1
        fi
        echo "=== Loading extension from $EXT_PATH ==="
        FAILED=0
        for sql_file in test/sql/*.sql; do
          echo "--- Running $sql_file ---"
          if duckdb -unsigned -c "LOAD '${EXT_PATH}';" < "$sql_file"; then
            echo "    PASS"
          else
            echo "    FAIL"
            FAILED=1
          fi
        done
        if [ "$FAILED" -ne 0 ]; then
          echo "=== Some e2e tests FAILED ==="
          exit 1
        fi
        echo "=== All e2e tests passed ==="

  demo:hello:
    desc: "Demo zig_hello scalar function"
    deps: [build]
    cmds:
      - |
        EXT_PATH=$(find zig-out/lib -name '*.duckdb_extension' 2>/dev/null | head -1)
        duckdb -unsigned -c "
          LOAD '${EXT_PATH}';
          SELECT zig_hello('Zig') AS greeting;
          SELECT zig_hello(name) AS greeting FROM (VALUES ('Alice'), ('Bob'), ('Charlie')) t(name);
        "

  demo:add-numbers:
    desc: "Demo zig_add_numbers scalar function"
    deps: [build]
    cmds:
      - |
        EXT_PATH=$(find zig-out/lib -name '*.duckdb_extension' 2>/dev/null | head -1)
        duckdb -unsigned -c "
          LOAD '${EXT_PATH}';
          SELECT zig_add_numbers(2, 3) AS result;
          SELECT i, zig_add_numbers(i, i * 10) AS result FROM generate_series(1, 5) t(i);
        "

  demo:tokenize:
    desc: "Demo zig_tokenize table function"
    deps: [build]
    cmds:
      - |
        EXT_PATH=$(find zig-out/lib -name '*.duckdb_extension' 2>/dev/null | head -1)
        duckdb -unsigned -c "
          LOAD '${EXT_PATH}';
          SELECT * FROM zig_tokenize('alice,bob,charlie', ',');
          SELECT * FROM zig_tokenize('one::two::three', '::');
          SELECT t.token_pos, t.token, length(t.token) AS len
            FROM zig_tokenize('the,quick,brown,fox', ',') t
            WHERE length(t.token) > 3;
        "

  bench:
    desc: "Benchmark scalar/table functions over 10M rows (ADR-0002)"
    deps: [build:release]
    cmds:
      - |
        EXT_PATH=$(find zig-out/lib -name '*.duckdb_extension' 2>/dev/null | head -1)
        if [ -z "$EXT_PATH" ]; then
          echo "ERROR: No .duckdb_extension found in zig-out/lib/"
          exit 1
        fi
        echo "=== Benchmarking with $EXT_PATH ==="
        echo "    (SUM forces evaluation; 3 runs each for stability)"

        echo ""
        echo "--- zig_add_numbers: 10M rows (hand-written) ---"
        for run in 1 2 3; do
          duckdb -unsigned -cmd ".timer on" -c "
            LOAD '${EXT_PATH}';
            SELECT sum(zig_add_numbers(i, i)) FROM generate_series(0, 9999999) t(i);
          " 2>&1 | grep "Run Time"
        done

        echo ""
        echo "--- ct_add_numbers: 10M rows (comptime) ---"
        for run in 1 2 3; do
          duckdb -unsigned -cmd ".timer on" -c "
            LOAD '${EXT_PATH}';
            SELECT sum(ct_add_numbers(i, i)) FROM generate_series(0, 9999999) t(i);
          " 2>&1 | grep "Run Time"
        done

        echo ""
        echo "--- zig_tokenize: 100K rows (hand-written) ---"
        for run in 1 2 3; do
          duckdb -unsigned -cmd ".timer on" -c "
            LOAD '${EXT_PATH}';
            SELECT count(*) FROM (
              SELECT t.token FROM generate_series(0, 99999) s(i),
              LATERAL (SELECT * FROM zig_tokenize('a,b,c,d,e', ',')) t
            );
          " 2>&1 | grep "Run Time"
        done

        echo ""
        echo "--- ct_tokenize: 100K rows (comptime) ---"
        for run in 1 2 3; do
          duckdb -unsigned -cmd ".timer on" -c "
            LOAD '${EXT_PATH}';
            SELECT count(*) FROM (
              SELECT t.token FROM generate_series(0, 99999) s(i),
              LATERAL (SELECT * FROM ct_tokenize('a,b,c,d,e', ',')) t
            );
          " 2>&1 | grep "Run Time"
        done

        echo ""
        echo "--- Extension binary size ---"
        ls -lh "$EXT_PATH"

  audit:
    desc: "Check for compiler warnings and deprecated patterns"
    cmds:
      - zig build -Doptimize=Debug 2>&1 | grep -i "deprecat\|warning" || echo "No warnings found."

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf zig-out zig-cache .zig-cache

  loc:
    desc: "Count lines of code"
    cmds:
      - tokei
