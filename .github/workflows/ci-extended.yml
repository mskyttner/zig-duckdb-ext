name: CI (extended)

# Checks that are slower or need more than Zig: kept apart so that they do not block a pull request. They run weekly,
# on demand, and when the files they cover change.

on:
  # On main too, so that main has the Zig cache these jobs restore: a cache saved on a pull request branch is not visible to
  # another branch, and the first run of a new branch would fetch everything cold.
  push:
    branches: [main]
    paths:
      - "src/cookbook/**"
      - "third_party/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - "test/data/arrow/**"
      - ".github/workflows/ci-extended.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/cookbook/**"
      - "third_party/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - "test/data/arrow/**"
      - ".github/workflows/ci-extended.yml"

permissions:
  contents: read

concurrency:
  group: ci-extended-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"

jobs:
  # The embedding recipe is a program that hosts DuckDB: it links DuckDB's static libraries (a large download that the
  # build fetches) and runs SQL, prepared statements, Arrow results, the tokenizer and the parser through the v2 API.
  cookbook-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The first fetch of a cold cache is where a network blip fails a job (a DNS failure took down one). Listing the steps
      # runs the build script, which asks for the dependencies, lazy ones included, and fetches them: retried here, apart from
      # the build, so that a failure of the build itself is not retried. (`zig build --fetch` would fetch only the eager ones.)
      - name: Fetch the dependencies (with retries)
        run: |
          for attempt in 1 2 3; do
            zig build -l > /dev/null && exit 0
            echo "fetch failed (attempt $attempt)"; sleep 20
          done
          exit 1
      - run: zig build cookbook-embed
      # Instances, attach, the catalog, and the documentation audit of the two v2 extensions (every function described, with
      # examples and categories, real parameter names, and every example runs).
      - run: zig build cookbook-embed-instance

  # The release's v2 tree, without publishing: every target cross-compiles, and the Linux amd64 build installs from the
  # tree into the alpha CLI and works (release.yml does the same before it deploys).
  dist-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The first fetch of a cold cache is where a network blip fails a job (a DNS failure took down one). Listing the steps
      # runs the build script, which asks for the dependencies, lazy ones included, and fetches them: retried here, apart from
      # the build, so that a failure of the build itself is not retried. (`zig build --fetch` would fetch only the eager ones.)
      - name: Fetch the dependencies (with retries)
        run: |
          for attempt in 1 2 3; do
            zig build -l > /dev/null && exit 0
            echo "fetch failed (attempt $attempt)"; sleep 20
          done
          exit 1
      - run: zig build dist-v2 -Doptimize=ReleaseSafe
      - run: zig build verify-dist-v2

  # Builds the real wasm32-emscripten SIDE_MODULE and loads it for real inside the latest
  # "loadable" engine build from each of the two duckdb-wasm forks this project has verified
  # against — not a mock, the actual CI artifact each fork publishes on its own default
  # branch. The two forks have diverged since official duckdb-wasm's 2026-10-21 DuckDB-2.0.0
  # bump (duckdb/duckdb-wasm#2285): haybarn-wasm is still on DuckDB 1.5.x, unsigned-friendly
  # `mvp` platform, emsdk 6.0.12; official duckdb-wasm discontinued `mvp` outright in favor of
  # `eh` (exceptions, no threads, every platform now needs `-fwasm-exceptions`), on a single
  # emsdk 6.0.9 pin. Each leg builds its own extension with the matching toolchain/platform
  # rather than sharing one build — see docs/rationale/0008_wasm-emscripten-side-module.md and
  # docs/v2-migration-plan.md's WASM section for the full trace, and tools/wasm_verify/ for
  # the scripts this job runs. The `eh_threads` platform (official duckdb-wasm's rebuilt
  # threaded target, confirmed live 2026-10-22 to work again after the bump) is not in this
  # job yet — verified so far only via an ad hoc, uncommitted browser page, not the committed
  # `verify_wasm_load_browser.cjs`/`browser/index.html` pair this job actually runs.
  #
  # duckdb-wasm's own leg is `continue-on-error`, 2026-10-22: confirmed, the hard way, that
  # `fetch_engine.sh`'s "latest success on default branch" can't currently resolve to
  # anything post-bump — official duckdb-wasm's `main.yml` has `on: push:` with no branch
  # filter, so it should have run on the merge commit, but has zero check-runs attached to it
  # at all (confirmed via that commit's own status API); the only green run found for the
  # bump turned out to be a *different*, abandoned branch (`bump-duckdb-v2.0.0-alpha44357`,
  # confirmed diverged from `main` — `ahead_by`/`behind_by: 44`, not an ancestor). The engine
  # is real and live (shell.duckdb.org redeployed it the same day, `version()` reports
  # `v2.0.0`/`Cyanoptera`, confirmed by downloading its actual `duckdb-eh.*.wasm`), just not
  # reachable through this script's GitHub-Actions-artifact path — and that live deployment's
  # own JS can't substitute either: its glue is generated together with that exact wasm build
  # (confirmed: pairing it with the npm package's JS throws `ASM_CONSTS[e] is not a function`,
  # an Emscripten JS/wasm version-pairing mismatch, not a defect in the built extension), and
  # its worker is a bespoke, undocumented protocol, not the npm `createDuckDB` API this job's
  # scripts drive. No reliable fresh artifact exists yet; self-heals once one does.
  wasm-verify:
    name: wasm-verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: haybarn-wasm
            repo: Query-farm-haybarn/haybarn-wasm
            emsdk_version: "6.0.12"
            wasm_step: "wasm-ext"
            platform: "wasm_mvp"
            allow_failure: false
          - name: duckdb-wasm
            repo: duckdb/duckdb-wasm
            emsdk_version: "6.0.9"
            wasm_step: "wasm-ext-eh"
            platform: "wasm_eh"
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ matrix.emsdk_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the wasm32-emscripten SIDE_MODULE
        run: zig build ${{ matrix.wasm_step }} -Demcc-path="$(command -v emcc)"

      # Needs at least public-repo read access to fetch another public repo's own CI
      # artifacts; the default GITHUB_TOKEN has worked for this in testing, but if GitHub
      # ever tightens cross-repo artifact-read scope for it, this step is where that
      # would surface, not fetch_engine.sh itself.
      - name: Fetch ${{ matrix.name }}'s latest loadable engine build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/wasm_verify/fetch_engine.sh ${{ matrix.repo }} .tmp/engine

      - name: Verify the extension loads and runs for real (Node bindings)
        continue-on-error: ${{ matrix.allow_failure }}
        run: |
          cd tools/wasm_verify
          npm install --no-audit --no-fund --silent
          NODE_PATH="$(pwd)/node_modules" node verify_wasm_load.cjs \
            "$GITHUB_WORKSPACE/.tmp/engine/packages/duckdb-wasm/dist" \
            "$GITHUB_WORKSPACE/zig-out/lib/${{ matrix.platform }}/zig_ext.duckdb_extension.wasm"

      # The Node check above exercises the engine's Node bindings; a real browser's own
      # fetch/Worker/dlopen path is otherwise unverified. `--with-deps` installs the OS
      # packages headless Chromium needs on a bare runner, not just the browser binary.
      - name: Install Playwright's Chromium
        run: cd tools/wasm_verify && npx playwright install --with-deps chromium

      - name: Verify the extension loads and runs for real (real headless browser)
        continue-on-error: ${{ matrix.allow_failure }}
        run: |
          cd tools/wasm_verify
          NODE_PATH="$(pwd)/node_modules" node verify_wasm_load_browser.cjs \
            "$GITHUB_WORKSPACE/.tmp/engine/packages/duckdb-wasm/dist" \
            "$GITHUB_WORKSPACE/zig-out/lib/${{ matrix.platform }}/zig_ext.duckdb_extension.wasm"

  # The Arrow IPC files that the cookbook suite writes are read back by PyArrow, an independent implementation.
  # `tools/verify_arrow_output.py` skips when PyArrow is missing, so it is installed here: a skip would prove nothing.
  # setup-python gives a Python whose pip may install (the runner's system Python refuses, PEP 668).
  arrow-pyarrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The first fetch of a cold cache is where a network blip fails a job (a DNS failure took down one). Listing the steps
      # runs the build script, which asks for the dependencies, lazy ones included, and fetches them: retried here, apart from
      # the build, so that a failure of the build itself is not retried. (`zig build --fetch` would fetch only the eager ones.)
      - name: Fetch the dependencies (with retries)
        run: |
          for attempt in 1 2 3; do
            zig build -l > /dev/null && exit 0
            echo "fetch failed (attempt $attempt)"; sleep 20
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow
      - name: Write the Arrow files (the cookbook suite)
        run: zig build sqllogictest-cookbook
      - name: Read them with PyArrow
        run: |
          python3 -c "import pyarrow; print('pyarrow', pyarrow.__version__)"
          python3 tools/verify_arrow_output.py
