name: Release extension

# Builds the real v1 extension and the two v2 extensions (zig_ext_v2 and the cookbook) for every target in build.zig's
# cross_targets (zig build dist, zig build dist-v2) and publishes the result as a custom
# DuckDB extension repository via GitHub Pages, per
# docs/rationale/0004_extension-distribution-and-signing.md.
#
# `INSTALL zig_ext FROM 'https://<owner>.github.io/<repo>/';` then works
# against the published tree (after `SET allow_unsigned_extensions=true;`
# — see that ADR for why v1's tree isn't signed).
#
# The v2 extensions are ALSO published a second time, signed, under dist/signed/ — if the
# DUCKDB_EXT_SIGNING_KEY repo secret is set (an RSA-2048 private key PEM; the matching public key
# is committed at signing/zig-duckdb-ext-signing-key.pub). That lets a v2.0+ client install with
# no -unsigned at all, via DuckDB's CREATE EXTENSION REPOSITORY mechanism, confirmed working end
# to end in the ADR above:
#   SET allow_extension_repositories='allowed';
#   CREATE EXTENSION REPOSITORY zigduckdbext WITH PREFIX 'https://<owner>.github.io/<repo>/signed/';
#   INSTALL zig_ext_v2 FROM zigduckdbext;
#   LOAD zig_ext_v2 FROM zigduckdbext;
# If the secret isn't set, the signing step and its verify job both no-op cleanly — the unsigned
# v1/v2 trees still publish exactly as before.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy to GitHub Pages (false: build and verify only, and keep the tree as an artifact)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancelling it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.17.0"
  # The repository's version directory must match a DuckDB CLIENT's own
  # exact running version (confirmed live, and in DuckDB's own source:
  # ExtensionHelper::GetVersionDirectoryName() uses DuckDB::LibraryVersion()
  # for a release build) — NOT the minimum-ABI-compatibility version the
  # extension's own metadata footer declares (target_duckdb_version in
  # build.zig, "v1.2.0": a separate concern). This is the latest stable
  # release this project has actually tested against this session.
  DUCKDB_VERSION: "v1.5.6"
  # Forwarded into `zig build cross` as -Dname/-Dapi-version/-Dextension-version;
  # defaults here match build.zig's own defaults.
  EXTENSION_NAME: "zig_ext"
  EXTENSION_API_VERSION: "v1.2.0"
  EXTENSION_VERSION: "v0.1.0"
  # The v2 extensions are built for one exact DuckDB version: build.zig's v2_duckdb_version, which moves with the pin
  # in build.zig.zon — keep this in sync with that constant by hand, they are not wired to read one another. The
  # tree has a directory per DuckDB version, so this one sits beside v1.5.6. The CLI is the same real, tagged
  # `v2.0.0` release build.zig.zon now pins (see its own dependency comments for the 2026-10-22 re-pin off the
  # staging mirror this URL used to point at).
  DUCKDB_V2_VERSION: "v2.0.0"
  DUCKDB_V2_CLI_URL: "https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz"
  EXTENSION_VERSION_V2: "v0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mlugg/setup-zig's canonical home is Codeberg, but its own README
      # says GitHub Actions can't use a non-GitHub-hosted action directly
      # (confirmed live: `uses: https://codeberg.org/...` fails to
      # resolve) — the github.com/mlugg/setup-zig mirror is the right
      # reference here. The mistake wasn't the mirror, it was @v1: that
      # tag couldn't resolve Zig 0.17.0 ("Unable to locate executable
      # file: zig"); @v2 can.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cross-compile and package the extension for every target
        run: |
          zig build dist \
            -Dname="${EXTENSION_NAME}" \
            -Dapi-version="${EXTENSION_API_VERSION}" \
            -Dextension-version="${EXTENSION_VERSION}" \
            -Ddist-version="${DUCKDB_VERSION}"
          find dist -type f

      - name: Cross-compile and package the v2 extensions (zig_ext_v2 and the cookbook)
        run: |
          zig build dist-v2 \
            -Doptimize=ReleaseSafe \
            -Ddist-version-v2="${DUCKDB_V2_VERSION}" \
            -Dextension-version-v2="${EXTENSION_VERSION_V2}"
          find "dist/${DUCKDB_V2_VERSION}" -type f

      # Second, signed copy of the v2 extensions, under dist/signed/ — see this file's own top
      # comment. The private key never appears in any log: it's written straight from the secrets
      # context into a 600-mode temp file via `printf`, never echoed, and removed once signing is
      # done (the runner is destroyed after the job regardless; this is defense in depth, not the
      # only safeguard). No-ops cleanly, leaving dist/signed/ absent, if the secret isn't set.
      - name: Sign the v2 extensions for the self-hosted signed-repository path
        env:
          SIGNING_KEY: ${{ secrets.DUCKDB_EXT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "DUCKDB_EXT_SIGNING_KEY secret not set; skipping the signed distribution tree"
            exit 0
          fi
          key_path="$RUNNER_TEMP/signing-key.pem"
          ( umask 077; printf '%s\n' "$SIGNING_KEY" > "$key_path" )
          zig build sign-extension-tool
          zig build dist-v2-signed \
            -Dsigning-key="$key_path" \
            -Ddist-version-v2="${DUCKDB_V2_VERSION}" \
            -Dextension-version-v2="${EXTENSION_VERSION_V2}"
          rm -f "$key_path"
          mkdir -p dist/signed/.well-known
          cp signing/duckdb-extension-repo.json dist/signed/.well-known/duckdb-extension-repo.json
          find "dist/signed/${DUCKDB_V2_VERSION}" -type f

      - name: Assemble the landing page and API docs alongside the extension repository
        run: |
          set -euo pipefail
          cp zig-out/index.html dist/index.html
          cp -r zig-out/docs dist/docs
          cp -r zig-out/docs-v2 dist/docs-v2
          find dist -maxdepth 1

      # The tree as a normal artifact, for the v2 check below and for a dry run (the Pages artifact is not downloadable).
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Installs the v2 extensions from the tree, in the DuckDB alpha they are built for (tools/verify_dist_v2.sh), before
  # anything is published. Linux amd64 only: the alpha CLI is not published for the other platforms.
  verify-v2:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Fetch the DuckDB alpha CLI
        run: |
          mkdir -p "$RUNNER_TEMP/duckdb-v2"
          curl -fsSL "${DUCKDB_V2_CLI_URL}" | tar -xz -C "$RUNNER_TEMP/duckdb-v2"
          "$RUNNER_TEMP/duckdb-v2/duckdb" --version
      - name: Install both extensions from the tree and use them
        run: tools/verify_dist_v2.sh "$RUNNER_TEMP/duckdb-v2/duckdb" dist

  # Same, but through the SIGNED repository path (CREATE EXTENSION REPOSITORY ... USING PUBLIC
  # KEY / LOAD ... FROM, no -unsigned) — see tools/verify_dist_v2_signed.sh. No-ops cleanly if
  # dist/signed doesn't exist (the signing secret wasn't set in the build job), so this job always
  # succeeds and never blocks deploy on a secret that's legitimately absent (e.g. a fork's CI run).
  verify-v2-signed:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Fetch the DuckDB alpha CLI
        run: |
          mkdir -p "$RUNNER_TEMP/duckdb-v2"
          curl -fsSL "${DUCKDB_V2_CLI_URL}" | tar -xz -C "$RUNNER_TEMP/duckdb-v2"
          "$RUNNER_TEMP/duckdb-v2/duckdb" --version
      - name: Install both signed extensions via CREATE EXTENSION REPOSITORY, no -unsigned
        run: |
          if [ ! -d "dist/signed" ]; then
            echo "dist/signed does not exist (DUCKDB_EXT_SIGNING_KEY secret not set) — nothing to verify"
            exit 0
          fi
          tools/verify_dist_v2_signed.sh "$RUNNER_TEMP/duckdb-v2/duckdb" signing/zig-duckdb-ext-signing-key.pub dist/signed

  deploy:
    needs: [build, verify-v2, verify-v2-signed]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-musl:
    name: verify-musl (${{ matrix.arch }})
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # Only arm64 actually needs emulation on these (x86_64) runners;
      # registering it is a no-op for the amd64 matrix leg.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # End-to-end: a real musl DuckDB CLI, in a real Alpine container,
      # installing the extension from the just-deployed GitHub Pages
      # repository — not a locally mounted build artifact — proving the
      # whole publish pipeline for the musl cross targets, not just that
      # they compile. See docs/rationale/0004_extension-distribution-and-signing.md
      # for why this is unsigned (`-unsigned`) rather than a trusted install.
      - name: Install and run the published extension (linux_${{ matrix.arch }}_musl)
        run: |
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            -e DUCKDB_VERSION="${DUCKDB_VERSION}" \
            -e EXTENSION_NAME="${EXTENSION_NAME}" \
            -e REPO_URL="${{ needs.deploy.outputs.page_url }}" \
            -e ARCH="${{ matrix.arch }}" \
            -v "${{ github.workspace }}/.github/scripts/verify-musl-e2e.sh:/verify.sh:ro" \
            docker.io/library/alpine:3.20 sh /verify.sh
